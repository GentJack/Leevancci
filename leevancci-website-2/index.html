<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leevancci</title>
<style>
:root{--bg:#fff;--fg:#111;--mut:#6b6b6b;--line:#e4e4e4;--soft:#f3f1ee}
@media (prefers-color-scheme:dark){:root{--bg:#141414;--fg:#f2f2f2;--mut:#9a9a9a;--line:#2e2e2e;--soft:#1f1e1c;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 "Helvetica Neue",Arial,sans-serif}
a{color:inherit;text-decoration:none}
button,select,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
input,select,textarea{width:100%;padding:11px;margin:0 0 10px;border:1px solid var(--line);background:var(--bg)}
.bar{background:var(--fg);color:var(--bg);text-align:center;padding:8px 12px;font-size:12px}
header{position:sticky;top:0;background:var(--bg);z-index:5;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:14px 20px}
header .r{display:flex;gap:16px;justify-content:flex-end;flex-wrap:wrap}
.logo{font:28px Georgia,serif;letter-spacing:.3em;text-transform:uppercase}
.hero{min-height:60vh;background:linear-gradient(90deg,rgba(20,16,14,.72),rgba(20,16,14,.08)),url("images/IMG_5484_Original.png") center 30%/cover no-repeat;color:#fff;display:flex;align-items:flex-end}
.hero div{padding:40px 24px}
.hero h1{font:400 clamp(30px,6vw,58px)/1.05 Georgia,serif;margin:0 0 12px}
h2{font:400 24px Georgia,serif;text-align:center;margin:48px 20px 24px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px 16px;padding:0 20px 40px}
.card .img{aspect-ratio:4/5;background:var(--soft);overflow:hidden}
.card .img img{width:100%;height:100%;object-fit:cover;display:block}
.card h4{margin:10px 0 2px;font-weight:400}
.card span,.mut{color:var(--mut)}
.lnk,.card button{font-size:12px;letter-spacing:.1em;text-transform:uppercase;border-bottom:1px solid currentColor}
.box{max-width:440px;margin:0 auto;padding:0 20px 48px}
.wide{max-width:900px}
.co{width:100%;background:var(--fg);color:var(--bg);padding:13px;text-transform:uppercase;letter-spacing:.12em;font-size:12px;margin-top:4px}
.err{color:#c0392b;min-height:20px}
.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.row select{width:auto;margin:0}
.sm{width:auto;padding:4px 10px;font-size:12px;border:1px solid var(--line)}
footer{padding:28px 20px;border-top:1px solid var(--line);color:var(--mut);text-align:center}
#cart{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);background:var(--bg);border-left:1px solid var(--line);z-index:9;transform:translateX(100%);transition:transform .25s;display:flex;flex-direction:column;padding:20px}
#cart.open{transform:none}
#items{flex:1;overflow:auto;margin:12px 0}
@media (max-width:760px){.grid{grid-template-columns:1fr 1fr}.logo{font-size:20px}header{padding:12px}}
</style>
</head>
<body>
<div class="bar" id="bar"></div>
<header>
 <a href="#/shop">Shop</a>
 <a class="logo" href="#/">Leevancci</a>
 <div class="r"><span id="acct"></span><button data-a="cart">Cart (<span id="n">0</span>)</button></div>
</header>
<main id="app"></main>
<footer>© Leevancci. All rights reserved.</footer>
<aside id="cart" aria-label="Cart">
 <div class="row" style="border:0"><strong>Your cart</strong><button data-a="close">Close</button></div>
 <div id="items"></div>
 <div class="row"><span>Subtotal</span><strong id="tot"></strong></div>
 <button class="co" data-a="checkout">Checkout</button>
</aside>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ===== PASTE YOUR SUPABASE DETAILS HERE (leave empty for demo mode) ===== */
var CFG={url:"",key:""};
/* ======================================================================== */
var demo=!(CFG.url&&CFG.key&&window.supabase);
var sb=demo?null:supabase.createClient(CFG.url,CFG.key);
var $=function(i){return document.getElementById(i)};
var esc=function(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
var money=function(c){return "$"+(c/100).toFixed(2)};
var LS={get:function(k,d){try{var v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}},set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
var SEED=[
 ["Embellished sneakers",89000,"IMG_5488_Original.jpeg"],
 ["Green shoulder bag",31000,"IMG_5490_Original.jpeg"],
 ["Two-piece swimwear",42000,"IMG_5479_Original.jpeg"],
 ["Platform slides",36000,"IMG_5492_Original.jpeg"],
 ["Quilted handbag",145000,"IMG_5491_Original.jpeg"],
 ["Activewear set",38000,"IMG_5480_Original.jpeg"],
 ["Black crossbody bag",18000,"IMG_5483_Original.jpeg"],
 ["Gold-tone watch",9500,"IMG_5487_Original.jpeg"]
].map(function(p,i){return{id:i+1,name:p[0],price_cents:p[1],image:p[2],description:""}});
var S={user:null,cart:LS.get("cart",[])};
var go=function(t){if(location.hash==t)route();else location.hash=t};

var D={
 products:async function(){
  if(demo)return LS.get("products",SEED);
  var r=await sb.from("products").select("*").eq("is_active",true).order("id");return r.data||[];
 },
 session:async function(){
  if(demo){var u=LS.get("user",null);return u?{id:u.email,email:u.email,admin:/admin/i.test(u.email)}:null}
  var s=(await sb.auth.getSession()).data.session;if(!s)return null;
  var p=await sb.from("profiles").select("is_admin").eq("id",s.user.id).single();
  return{id:s.user.id,email:s.user.email,admin:!!(p.data&&p.data.is_admin)};
 },
 signup:async function(n,e,p){
  if(demo){LS.set("user",{email:e,name:n});return{}}
  var r=await sb.auth.signUp({email:e,password:p,options:{data:{full_name:n}}});
  return{error:r.error,msg:!r.error&&!r.data.session?"Check your email to confirm your account, then log in.":""};
 },
 login:async function(e,p){
  if(demo){LS.set("user",{email:e});return{}}
  return{error:(await sb.auth.signInWithPassword({email:e,password:p})).error};
 },
 logout:async function(){if(demo)LS.set("user",null);else await sb.auth.signOut()},
 saveProduct:async function(n,price,d){
  var row={name:n,price_cents:Math.round(price*100),description:d,slug:n.toLowerCase().replace(/[^a-z0-9]+/g,"-")+"-"+Date.now().toString(36)};
  if(demo){var a=LS.get("products",SEED);row.id=Date.now();a.push(row);LS.set("products",a);return{}}
  return{error:(await sb.from("products").insert(row)).error};
 },
 delProduct:async function(id){
  if(demo){LS.set("products",LS.get("products",SEED).filter(function(p){return p.id!=id}));return{}}
  return{error:(await sb.from("products").delete().eq("id",id)).error};
 },
 order:async function(addr,items,ship){
  var sub=items.reduce(function(s,i){return s+i.price_cents},0),tot=sub+ship;
  var lines=items.map(function(i){return{product_name:i.name,unit_price_cents:i.price_cents,quantity:1}});
  if(demo){var o=LS.get("orders",[]),id=o.length+1001;o.push({id:id,status:"pending",total_cents:tot,shipping_address:addr,created_at:new Date().toISOString(),order_items:lines});LS.set("orders",o);return{id:id}}
  var r=await sb.from("orders").insert({user_id:S.user.id,status:"pending",subtotal_cents:sub,shipping_cents:ship,total_cents:tot,shipping_address:addr}).select("id").single();
  if(r.error)return{error:r.error};
  lines.forEach(function(l){l.order_id=r.data.id});
  var x=await sb.from("order_items").insert(lines);
  return{id:r.data.id,error:x.error};
 },
 orders:async function(){
  if(demo)return LS.get("orders",[]).slice().reverse();
  return(await sb.from("orders").select("*, order_items(*)").order("id",{ascending:false})).data||[];
 },
 setStatus:async function(id,s){
  if(demo){var o=LS.get("orders",[]);o.forEach(function(x){if(x.id==id)x.status=s});LS.set("orders",o);return{}}
  return{error:(await sb.from("orders").update({status:s}).eq("id",id)).error};
 }
};

function authView(su){
 $("app").innerHTML='<section class="box"><h2>'+(su?"Create account":"Log in")+'</h2><form id="'+(su?"signup":"login")+'">'+(su?'<input name="n" placeholder="Full name" required>':'')+'<input name="e" type="email" placeholder="Email" required><input name="p" type="password" minlength="6" placeholder="Password (6+ characters)" required><button class="co">'+(su?"Sign up":"Log in")+'</button><p id="msg" class="err" role="alert"></p></form><p class="mut">'+(su?'Have an account? <a class="lnk" href="#/login">Log in</a>':'New here? <a class="lnk" href="#/signup">Create an account</a>')+'</p>'+(demo?'<p class="mut">Demo tip: any email works. Use one containing "admin" to open the admin page.</p>':'')+'</section>';
}
var V={
 home:async function(){
  var ps=await D.products();
  $("app").innerHTML='<section class="hero"><div><h1>The Autumn Collection</h1><a class="lnk" href="#/shop">Shop now</a></div></section><h2 id="shop">New arrivals</h2><section class="grid">'+ps.map(function(p){return'<article class="card"><div class="img"><img src="images/'+esc(p.image||({1:"IMG_5488_Original.jpeg",2:"IMG_5490_Original.jpeg",3:"IMG_5479_Original.jpeg",4:"IMG_5492_Original.jpeg",5:"IMG_5491_Original.jpeg",6:"IMG_5480_Original.jpeg",7:"IMG_5483_Original.jpeg",8:"IMG_5487_Original.jpeg"}[p.id]||"IMG_5488_Original.jpeg"))+'" alt="'+esc(p.name)+'" loading="lazy"></div><h4>'+esc(p.name)+'</h4><span>'+money(p.price_cents)+'</span><br><button data-a="add" data-id="'+p.id+'" data-n="'+esc(p.name)+'" data-p="'+p.price_cents+'">Add to cart</button></article>'}).join("")+'</section>';
  window.PS=ps;
 },
 shop:async function(){await V.home();$("shop").scrollIntoView()},
 login:async function(){authView(false)},
 signup:async function(){authView(true)},
 checkout:async function(){
  if(!S.user){go("#/login");return}
  if(!S.cart.length){$("app").innerHTML='<section class="box"><h2>Checkout</h2><p>Your cart is empty.</p><a class="lnk" href="#/shop">Continue shopping</a></section>';return}
  var sub=S.cart.reduce(function(s,i){return s+i.price_cents},0),ship=sub>=20000?0:1500;
  $("app").innerHTML='<section class="box"><h2>Checkout</h2>'+S.cart.map(function(i){return'<div class="row"><span>'+esc(i.name)+'</span><span>'+money(i.price_cents)+'</span></div>'}).join("")+'<div class="row"><span>Shipping</span><span>'+(ship?money(ship):"Free")+'</span></div><div class="row"><strong>Total</strong><strong>'+money(sub+ship)+'</strong></div><h3>Delivery details</h3><form id="ship"><input name="name" placeholder="Full name" required><input name="line1" placeholder="Address" required><input name="city" placeholder="City" required><input name="postal_code" placeholder="Postal code"><input name="country" placeholder="Country" required><p class="mut">Test payment only. No money is taken.</p><button class="co">Place order</button><p id="msg" class="err" role="alert"></p></form></section>';
 },
 done:async function(){$("app").innerHTML='<section class="box"><h2>Thank you</h2><p>Your order #'+esc(location.hash.split("/")[2]||"")+' was placed.</p><a class="lnk" href="#/shop">Continue shopping</a></section>'},
 admin:async function(){
  if(!S.user||!S.user.admin){$("app").innerHTML='<section class="box"><h2>Admin</h2><p>Admins only. Log in with an admin account.</p></section>';return}
  var ps=await D.products(),os=await D.orders(),st=["pending","paid","shipped","delivered","cancelled","refunded"];
  $("app").innerHTML='<section class="box wide"><h2>Admin</h2><h3>Add product</h3><form id="padd"><input name="n" placeholder="Product name" required><input name="p" type="number" step="0.01" min="0" placeholder="Price (USD)" required><textarea name="d" placeholder="Description"></textarea><button class="co">Add product</button><p id="msg" class="err" role="alert"></p></form><h3>Products ('+ps.length+')</h3>'+ps.map(function(p){return'<div class="row"><span>'+esc(p.name)+' <span class="mut">'+money(p.price_cents)+'</span></span><button class="sm" data-a="del" data-id="'+p.id+'">Delete</button></div>'}).join("")+'<h3>Orders ('+os.length+')</h3>'+(os.map(function(o){var a=o.shipping_address||{};return'<div class="row"><span>#'+o.id+' '+esc(a.name)+', '+esc(a.city)+'<br><span class="mut">'+(o.order_items||[]).map(function(i){return esc(i.product_name)}).join(", ")+'</span></span><span>'+money(o.total_cents)+' <select data-oid="'+o.id+'">'+st.map(function(s){return'<option'+(s==o.status?' selected':'')+'>'+s+'</option>'}).join("")+'</select></span></div>'}).join("")||'<p class="mut">No orders yet.</p>')+'</section>';
 }
};
async function route(){
 S.user=await D.session();
 $("acct").innerHTML=S.user?(S.user.admin?'<a href="#/admin">Admin</a> ':'')+'<button data-a="out">Logout</button>':'<a href="#/login">Login</a> <a href="#/signup">Sign up</a>';
 $("bar").textContent=demo?"Demo mode: data stays in this browser. Add Supabase keys to go live.":"Complimentary shipping on orders over $200";
 var h=location.hash.replace("#/","").split("/")[0]||"home";
 await(V[h]||V.home)();draw();
}
function draw(){
 var t=0;
 $("items").innerHTML=S.cart.map(function(i,k){t+=i.price_cents;return'<div class="row"><span>'+esc(i.name)+'</span><span>'+money(i.price_cents)+' <button data-a="rm" data-id="'+k+'" aria-label="Remove">✕</button></span></div>'}).join("")||'<p class="mut">Your cart is empty.</p>';
 $("tot").textContent=money(t);$("n").textContent=S.cart.length;LS.set("cart",S.cart);
}
document.addEventListener("click",async function(e){
 var b=e.target.closest("[data-a]");if(!b)return;
 var a=b.dataset.a,c=$("cart");
 if(a=="add"){S.cart.push({id:+b.dataset.id,name:b.dataset.n,price_cents:+b.dataset.p});draw();c.classList.add("open")}
 else if(a=="rm"){S.cart.splice(+b.dataset.id,1);draw()}
 else if(a=="cart")c.classList.add("open");
 else if(a=="close")c.classList.remove("open");
 else if(a=="checkout"){c.classList.remove("open");go("#/checkout")}
 else if(a=="out"){await D.logout();go("#/")}
 else if(a=="del"&&confirm("Delete this product?")){await D.delProduct(b.dataset.id);route()}
});
document.addEventListener("change",async function(e){
 if(e.target.dataset.oid){var r=await D.setStatus(e.target.dataset.oid,e.target.value);if(r.error)alert(r.error.message)}
});
document.addEventListener("submit",async function(e){
 e.preventDefault();
 var f=e.target,v=function(n){return f.elements[n]?f.elements[n].value.trim():""},m=$("msg"),r;
 m.textContent="";
 if(f.id=="signup"||f.id=="login"){
  r=f.id=="signup"?await D.signup(v("n"),v("e"),v("p")):await D.login(v("e"),v("p"));
  if(r.error){m.textContent=r.error.message;return}
  if(r.msg){m.textContent=r.msg;return}
  go(S.cart.length?"#/checkout":"#/");
 }else if(f.id=="padd"){
  r=await D.saveProduct(v("n"),parseFloat(v("p")),v("d"));
  if(r.error)m.textContent=r.error.message;else route();
 }else if(f.id=="ship"){
  var sub=S.cart.reduce(function(s,i){return s+i.price_cents},0);
  r=await D.order({name:v("name"),line1:v("line1"),city:v("city"),postal_code:v("postal_code"),country:v("country"),email:S.user.email},S.cart,sub>=20000?0:1500);
  if(r.error){m.textContent=r.error.message;return}
  S.cart=[];draw();go("#/done/"+r.id);
 }
});
window.addEventListener("hashchange",route);
route();
</script>
</body>
</html>
